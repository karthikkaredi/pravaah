<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pravaah Dashboard - Green Day Initiative</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark-blue: #000033;
            --bg-accent: #001f4d;
            --neon-blue: #00FFFF;
            --text-light: #FFFFFF;
            --separator-color: #00FFFF;
            --carbon-save-color: #1abc9c;
        }

        body {
            font-family: 'Roboto', sans-serif;
            color: var(--text-light);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--bg-dark-blue);
        }

        .dashboard-container {
            width: 100%;
            max-width: none;
            margin: 0;
        }

        .dashboard-header {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 30px;
            background-color: var(--bg-accent);
            border-bottom: 1px solid var(--separator-color);
        }

        .logo-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 5px 0;
        }

        .logo {
            max-width: 100%;
        }

        .left-logo {
            height: 180px;
        }

        .left-logo .logo {
            max-height: 180px;
        }

        .pravaah-logo {
            width: 300px;
        }

        .pravaah-logo .logo {
            max-height: 84px;
            margin: auto;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 25px;
            padding: 40px 30px;
        }

        .data-card {
            text-align: center;
        }

        .large-metric {
            grid-column: span 3;
        }

        .separator-placeholder {
            grid-column: span 6;
            border-top: 1px dashed var(--separator-color);
            border-bottom: 1px dashed var(--separator-color);
            padding: 10px 0;
            margin: 5px 0;
            text-align: center;
        }

        .carbon-metric {
            grid-column: span 3;
        }

        /* Updated: numbers under POWER & LIGHT are WHITE */
        .saving-value {
            color: var(--text-light);
        }

        .label {
            font-size: 0.8em;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .label .symbol {
            font-size: 1.2em;
            margin-right: 5px;
            font-weight: 900;
        }

        .value {
            margin: 0;
            font-weight: 900;
        }

        .large-metric .value {
            font-size: 4em;
        }

        .data-card h3.value {
            font-size: 2.5em;
        }

        #carbon-reduction-display {
            position: fixed;
            bottom: 120px;
            right: 20px;
            padding: 15px 20px;
            background-color: var(--carbon-save-color);
            color: var(--bg-dark-blue);
            border-radius: 8px;
            font-weight: 900;
            text-align: center;
            width: 150px;
            box-shadow: 0 0 15px rgba(26,188,156,0.8);
        }
        #carbon-reduction-display .percentage-value {
            font-size: 2em;
            display: block;
        }
        .label-text {
            font-size: 0.8em;
            font-weight: 700;
            text-transform: uppercase;
        }

        #live-datetime {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 15px;
            background: rgba(0,0,0,0.4);
            border-radius: 5px;
            border: 1px solid var(--neon-blue);
            font-size: 1em;
        }

        #live-datetime .time {
            font-size: 1.8em;
            display: block;
        }

        @media (max-width: 768px) {
            .data-grid {
                grid-template-columns: 1fr;
                gap: 30px;
                padding: 20px 15px;
            }

            .large-metric,
            .separator-placeholder,
            .carbon-metric {
                grid-column: 1 / -1 !important;
            }

            .large-metric .value {
                font-size: 3em;
            }

            #carbon-reduction-display {
                bottom: 100px;
                width: 120px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header class="dashboard-header">
            <div class="logo-placeholder left-logo"><img src="logo1.png" class="logo" alt="Left Logo"></div>
            <div class="logo-placeholder pravaah-logo"><img src="title.png" class="logo" alt="Pravaah Logo"></div>
        </header>
        <main class="data-grid">
            <div class="data-card large-metric">
                <p class="label"><span class="symbol">👣</span>TOTAL STEPS</p>
                <h1 id="total-steps" class="value">0</h1>
            </div>
            <div class="data-card large-metric">
                <p class="label"><span class="symbol">⚡</span>JOULES OF ENERGY PRODUCED</p>
                <h1 id="energy-produced" class="value">0</h1>
            </div>

            <div class="separator-placeholder">
                <span class="symbol">📡</span>
                <strong>PRAVAAH: LIVE DATA FEED</strong>
            </div>

            <div class="data-card carbon-metric">
                <p class="label"><span class="symbol">📊</span>POWER (Watts)</p>
                <h3 id="current-power-watts" class="value saving-value">0 W</h3>
            </div>

            <div class="data-card carbon-metric">
                <p class="label"><span class="symbol">💡</span>EQUIVALENT LIGHT USAGE (15W)</p>
                <h3 id="bulb-runtime-hours" class="value saving-value">0 hours</h3>
            </div>
        </main>
    </div>
    <div id="carbon-reduction-display">
        <span class="label-text">Carbon footprint reduced by </span>
        <span class="percentage-value" id="co2-reduction-percent">36.9%</span>
    </div>
    <div id="live-datetime"></div>
    <script>
        const API_ENDPOINT = 'http://192.168.0.107:3000/api/sensor-data';
        const FETCH_INTERVAL_MS = 1000; 
        const JOULES_PER_STEP = 5.6;

        let lastSuccessfulData = {
            total_steps: Number(localStorage.getItem('pravaah_total_steps') || 0)
        };

        function updateDateTime() {
            const now = new Date();
            document.getElementById('live-datetime').innerHTML =
                `<span class="time">${now.toLocaleTimeString()}</span>${now.toDateString()}`;
        }

        async function fetchAPIData() {
            try {
                const response = await fetch(API_ENDPOINT, { cache: 'no-store' });
                if (!response.ok) throw new Error(`Server returned ${response.status}`);

                const data = await response.json();
                if (typeof data.total_steps === 'number') {
                    lastSuccessfulData.total_steps = data.total_steps;
                    localStorage.setItem('pravaah_total_steps', data.total_steps);
                }
            } catch {
                console.warn('API unreachable, showing last saved data');
            }

            renderDashboardData(lastSuccessfulData);
        }

        function renderDashboardData(apiData) {
            const totalSteps = apiData.total_steps || 0;
            const energyProducedJoules = totalSteps * JOULES_PER_STEP;
            const currentPowerWatts = energyProducedJoules / 2;

            const hoursRuntime = totalSteps / 7200;
            let runtimeDisplay = hoursRuntime < 1
                ? (hoursRuntime * 60).toFixed(1) + ' minutes'
                : hoursRuntime.toFixed(2) + ' hours';

            document.getElementById('total-steps').textContent = totalSteps.toLocaleString();
            document.getElementById('energy-produced').textContent = energyProducedJoules.toLocaleString();
            document.getElementById('current-power-watts').textContent = currentPowerWatts.toFixed(1) + ' W';
            document.getElementById('bulb-runtime-hours').textContent = runtimeDisplay;

            document.getElementById('co2-reduction-percent').textContent = '37.1%';
        }

        updateDateTime();
        fetchAPIData();

        setInterval(updateDateTime, 1000);
        setInterval(fetchAPIData, FETCH_INTERVAL_MS);
    </script>
</body>
</html>
